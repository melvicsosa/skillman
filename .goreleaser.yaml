# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: skillman

# The frontend is built by the release workflow (make web) before goreleaser
# runs, so web/dist is already populated when the Go build embeds it.
before:
  hooks:
    - go mod tidy

builds:
  - id: skillman
    main: ./cmd/skillman
    binary: skillman
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/melvicsosa/skillman/internal/app/version.Version={{ .Version }}
      - -X github.com/melvicsosa/skillman/internal/app/version.Commit={{ .ShortCommit }}
      - -X github.com/melvicsosa/skillman/internal/app/version.Date={{ .Date }}

  # The menu bar app needs CGO (Cocoa via fyne.io/systray), so the release
  # job runs on macOS; the CGO-free skillman binaries cross-compile from there.
  - id: skillman-tray
    main: ./cmd/skillman-tray
    binary: skillman-tray
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/melvicsosa/skillman/internal/app/version.Version={{ .Version }}
      - -X github.com/melvicsosa/skillman/internal/app/version.Commit={{ .ShortCommit }}
      - -X github.com/melvicsosa/skillman/internal/app/version.Date={{ .Date }}

# Both archive ids share one name_template so the brew formula keeps
# resolving <project>_<version>_<os>_<arch>.tar.gz.
archives:
  - id: default
    ids:
      - skillman
      - skillman-tray
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # skillman-tray only builds for darwin, so linux archives carry one binary.
    allow_different_binary_count: true
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: melvicsosa
    name: skillman

brews:
  - name: skillman
    repository:
      owner: melvicsosa
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/melvicsosa/skillman
    description: "Cross-agent AI skill manager with a local UI"
    license: MIT
    commit_author:
      name: goreleaser
      email: bot@goreleaser.com
    install: |
      bin.install "skillman"
      bin.install "skillman-tray" if OS.mac?
    test: |
      system "#{bin}/skillman", "version"
